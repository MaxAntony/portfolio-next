services:
  nginx-proxy:
    image: jwilder/nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs:ro
      - /etc/nginx/vhost.d
      - /usr/share/nginx/html
    labels:
      - com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy
    networks:
      - public_web

  letsencrypt:
    image: nginxproxy/acme-companion
    restart: always
    volumes:
      - ./certs:/etc/nginx/certs:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    volumes_from:
      - nginx-proxy:rw
    networks:
      - public_web

  maxantony-nginx:
    image: nginx
    restart: always
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VIRTUAL_HOST=maxantony.com
      - LETSENCRYPT_HOST=maxantony.com
      - LETSENCRYPT_EMAIL=maxpacami@gmail.com
    networks:
      - public_web

  maxantony:
    image: maxantony/portfolio
    restart: always
    expose:
      - "3000"
    networks:
      - public_web

networks:
  public_web:
    name: public_web
